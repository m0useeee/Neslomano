<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Neslomano</title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body>

<div class="register-container">
    <div class="logo-icon">N</div>
    <h1>Neslomano</h1>
    <p class="subtitle">Создание аккаунта</p>

    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage">Регистрация успешна! Проверьте почту для подтверждения.</div>

    <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
            <label for="fullName">ФИО</label>
            <input type="text" id="fullName" placeholder="Иванов Иван Иванович" required>
        </div>

        <div class="form-group">
            <label for="email">Электронная почта</label>
            <input type="email" id="email" placeholder="ivanov@college.ru" required>
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Введите пароль" required>
                <button type="button" class="toggle-password" id="togglePassword">Показать</button>
            </div>
            <div class="password-requirements" id="passwordRequirements">
                Пароль должен содержать:
                <span id="reqUpper" class="invalid">заглавную букву</span>,
                <span id="reqDigit" class="invalid">цифру</span>,
                <span id="reqSpecial" class="invalid">спецсимвол</span>
            </div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Подтверждение пароля</label>
            <div class="password-wrapper">
                <input type="password" id="confirmPassword" placeholder="Повторите пароль" required>
            </div>
        </div>

        <button type="submit" class="btn-register">Зарегистрироваться</button>
    </form>

    <div class="login-link">
        Уже есть аккаунт? <a href="login.html">Войти</a>
    </div>
</div>

<script src="js/register.js"></script>
</body>
</html>
