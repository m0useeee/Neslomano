<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля — Neslomano</title>
    <link rel="stylesheet" href="css/reset-password.css">
</head>
<body>

<div class="reset-container">
    <div class="logo-icon">N</div>
    <h1>Neslomano</h1>
    <p class="subtitle">Восстановление пароля</p>

    <div id="errorMessage" class="message error"></div>
    <div id="successMessage" class="message success">[OK] Ссылка для сброса пароля отправлена на ваш email.</div>

    <form id="resetForm">
        <div class="form-group">
            <label for="email">Электронная почта</label>
            <input type="email" id="email" placeholder="ivanov@college.ru" required>
            <small>Введите email, который вы указывали при регистрации</small>
        </div>
        <button type="submit" class="btn-reset">Отправить ссылку</button>
    </form>

    <div class="login-link">
        <a href="login.html">Вернуться ко входу</a>
    </div>
</div>

<script src="js/reset-password.js"></script>
</body>
</html>
