<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Neslomano</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="login-container">
    <div class="logo-icon">N</div>
    <h1>Neslomano</h1>
    <p class="subtitle">Ремонт оборудования колледжа</p>

    <div class="error-message" id="errorMessage">Неверный email или пароль</div>

    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label for="email">Электронная почта</label>
            <input type="email" id="email" placeholder="Введите электронную почту" required>
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Введите пароль" required>
                <button type="button" class="toggle-password" id="togglePassword">Показать</button>
            </div>
        </div>

        <div class="form-options">
            <a href="reset-password.html">Забыли пароль?</a>
        </div>

        <button type="submit" class="btn-login">Войти</button>
    </form>

    <div class="register-link">
        Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
    </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
